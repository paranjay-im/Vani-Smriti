# Neo4j for the context graph.  docker compose up -d neo4j      (browser: http://localhost:7474)
# NEO4J_PASSWORD comes from context_layer/.env (see .env.example). Neo4j needs at least 8 characters.
# neo4j-test is a disposable second instance for the parity tests and the freshness benchmark, so they never touch the real graph.
services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
  neo4j-test:
    image: neo4j:5.26-community
    profiles: ["test"]
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G

volumes:
  neo4j_data:
